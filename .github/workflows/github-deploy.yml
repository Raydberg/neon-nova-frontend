name: Angular CI/CD with Bun and Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Paso clave: Crear un archivo .env con los secrets
      - name: Create environment file
        run: |
          echo "NG_APP_API_URL=${{ secrets.NG_APP_API_URL }}" > .env
          echo "NG_APP_API_CLIENT_URL=${{ secrets.NG_APP_API_CLIENT_URL }}" >> .env
          echo "NG_APP_GOOGLE_CALLBACK=${{ secrets.NG_APP_GOOGLE_CALLBACK }}" >> .env

      # Build con variables de entorno
      - name: Build Angular app
        run: bun run build -- --configuration=production
        env:
          NG_APP_API_URL: ${{ secrets.NG_APP_API_URL }}
          NG_APP_API_CLIENT_URL: ${{ secrets.NG_APP_API_CLIENT_URL }}
          NG_APP_GOOGLE_CALLBACK: ${{ secrets.NG_APP_GOOGLE_CALLBACK }}

      # Fallback para asegurarnos de que las variables estén disponibles
      - name: Inject environment variables into index.html
        run: |
          echo "Injecting environment variables into index.html"
          sed -i 's|</head>|<script>window.env = { NG_APP_API_URL: "${{ secrets.NG_APP_API_URL }}", NG_APP_API_CLIENT_URL: "${{ secrets.NG_APP_API_CLIENT_URL }}", NG_APP_GOOGLE_CALLBACK: "${{ secrets.NG_APP_GOOGLE_CALLBACK }}" };</script></head>|' ./dist/neon-nova/browser/index.html
          echo "Environment variables injected successfully"

      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist/neon-nova/browser
          retention-days: 1

  # Deploy to production only on push to main
  deploy-production:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist/neon-nova/browser

      - name: Deploy to Netlify (Production)
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: './dist/neon-nova/browser'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Production deploy from GitHub Actions"
          enable-commit-comment: false
          enable-pull-request-comment: false
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

  # Deploy preview for PRs
  deploy-preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist/neon-nova/browser

      - name: Deploy to Netlify (Preview)
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: './dist/neon-nova/browser'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Preview deploy from PR #${{ github.event.number }}"
          enable-commit-comment: false
          enable-pull-request-comment: true
          overwrites-pull-request-comment: true
          production-deploy: false
          alias: preview-pr-${{ github.event.number }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
