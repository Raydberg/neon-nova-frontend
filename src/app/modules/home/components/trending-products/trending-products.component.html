<section class="py-12">
  <div class="container mx-auto px-4">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center">
        <lucide-angular
          [img]="TrendingUpIcon"
          class="w-6 h-6 mr-2 text-primary"
        ></lucide-angular>
        <div>
          <h2 class="text-3xl font-bold tracking-tight">
            Productos en tendencia
          </h2>
          <p class="mt-2 text-muted-foreground">
            Los productos más populares del momento
          </p>
        </div>
      </div>
      <a
        routerLink="/productos"
        [queryParams]="{ tendencia: true }"
        class="btn btn-outline"
      >
        Ver todos
      </a>
    </div>

    <!-- Carousel -->
    <div class="relative">
      <!-- Products container -->
      <div
        #carouselContainer
        class="flex overflow-x-auto gap-6 pb-4 hide-scrollbar carousel-container"
        style="scrollbar-width: none; -ms-overflow-style: none"
        (scroll)="onScroll($event)"
      >
        @for (product of enhancedProducts(); track product.id; let i = $index) {
        <div
          class="product-card min-w-[300px] md:min-w-[320px]"
          [style.--animation-delay]="i * 0.1 + 's'"
          [class.animate-in]="isVisible()"
        >
          <!-- Etiqueta añadida en un contenedor para posicionarla sobre la tarjeta de producto -->
          <div class="relative">
            @if (product.etiqueta) {
            <div class="badge badge-primary absolute top-2 left-2 z-10">
              {{ product.etiqueta }}
            </div>
            }

            <!-- Información del precio anterior, si existe -->
            @if (product.precioAnterior) {
            <div
              class="absolute top-2 right-2 z-10 px-2 py-1 text-sm bg-red-500 text-white rounded-lg"
            >
              -{{ calcularDescuento(product.price, product.precioAnterior) }}%
            </div>
            }

            <!-- Usando el componente ProductCard -->
            <product-card [product]="product"></product-card>
          </div>
        </div>
        }
      </div>

      <!-- Navigation buttons -->
      <button
        (click)="scroll('left')"
        class="btn btn-circle btn-outline absolute left-0 top-1/2 -translate-y-1/2 z-10 bg-base-100 shadow-md"
        [class.opacity-50]="!canScrollLeft()"
        [disabled]="!canScrollLeft()"
      >
        <lucide-angular
          [img]="ChevronLeftIcon"
          class="w-5 h-5"
        ></lucide-angular>
      </button>

      <button
        (click)="scroll('right')"
        class="btn btn-circle btn-outline absolute right-0 top-1/2 -translate-y-1/2 z-10 bg-base-100 shadow-md"
        [class.opacity-50]="!canScrollRight()"
        [disabled]="!canScrollRight()"
      >
        <lucide-angular
          [img]="ChevronRightIcon"
          class="w-5 h-5"
        ></lucide-angular>
      </button>

      <!-- Indicador de autoplay -->
      <div
        class="absolute bottom-[-20px] left-1/2 transform -translate-x-1/2 flex space-x-2"
      >
        <div class="w-16 h-1 bg-gray-200 rounded-full overflow-hidden">
          <div
            class="h-full bg-primary"
            [class.autoplay-progress]="isAutoplayActive()"
          ></div>
        </div>
      </div>
    </div>
  </div>
</section>

<style>
  .hide-scrollbar::-webkit-scrollbar {
    display: none;
  }

  .product-card {
    opacity: 0;
    transform: translateY(20px);
    transition-property: opacity, transform;
    transition-duration: 0.5s;
    transition-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
    will-change: transform, opacity;
  }

  .product-card.animate-in {
    opacity: 1;
    transform: translateY(0);
    transition-delay: var(--animation-delay, 0s);
  }

  .badge {
    z-index: 5;
  }

  .btn-circle {
    transition: all 0.2s ease;
  }

  .btn-circle:hover:not(:disabled) {
    transform: translateY(-50%) scale(1.05);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
  }

  .carousel-container {
    scroll-behavior: smooth;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }

  .autoplay-progress {
    animation: autoplay-progress 5s linear infinite;
  }

  @keyframes autoplay-progress {
    0% {
      width: 0;
    }
    100% {
      width: 100%;
    }
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
