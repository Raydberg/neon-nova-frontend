<div class="relative overflow-hidden bg-gray-100 h-[600px] md:h-[650px]">
  <!-- Main slide content -->
  @for (slide of heroSlides; track slide; let i = $index) {
  <div
    #slideContainer
    [class.hidden]="i !== currentSlide()"
    class="absolute inset-0 opacity-0"
    [class]="'bg-gradient-to-r ' + slide.color"
  >
    <div class="container relative h-full px-4 mx-auto">
      <div class="grid items-center h-full grid-cols-1 gap-8 md:grid-cols-2">
        <!-- Text content -->
        <div #textContent class="text-white opacity-0 z-10">
          <span
            class="inline-block px-3 py-1 mb-4 text-sm font-medium bg-white/20 rounded-full backdrop-blur-sm"
          >
            {{ slide.subtitle }}
          </span>
          <h1
            class="mb-4 text-4xl font-bold tracking-tight sm:text-5xl lg:text-6xl"
          >
            {{ slide.title }}
          </h1>
          <p class="mb-8 text-lg md:text-xl text-white/90">
            {{ slide.description }}
          </p>
          <div class="flex flex-wrap gap-4">
            <a
              [routerLink]="slide.primaryButton.link"
              class="inline-flex items-center justify-center gap-2 px-6 py-3 text-base font-medium text-blue-700 bg-white rounded-md shadow-sm hover:bg-gray-100 dark:bg-blue-600 dark:text-white dark:hover:bg-blue-700 transition-colors"
            >
              <lucide-angular [img]="ShoppingCart" class="w-5 h-5"></lucide-angular>
              {{ slide.primaryButton.text }}
            </a>
            <a
              [routerLink]="slide.secondaryButton.link"
              class="inline-flex items-center justify-center gap-2 px-6 py-3 text-base font-medium text-white border border-white rounded-md hover:bg-white/10 transition-colors"
            >
              {{ slide.secondaryButton.text }}
              <lucide-angular [img]="ArrowRight" class="w-5 h-5"></lucide-angular>
            </a>
          </div>
        </div>

        <!-- Image content -->
        <div #imageContent class="hidden md:block opacity-0 relative z-0">
          <div class="overflow-hidden rounded-lg shadow-2xl aspect-[4/3]">
            <img
              [src]="slide.image"
              [alt]="slide.title"
              class="object-cover w-full h-full transition-transform hover:scale-105 duration-500"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
  }

  <!-- Navigation buttons -->
  <button
    class="absolute p-3 transform -translate-y-1/2 bg-white/90 rounded-full shadow-md left-4 top-1/2 hover:scale-110 transition-transform hover:bg-white"
    (click)="prevSlide()"
    aria-label="Previous slide"
  >
    <lucide-angular [img]="ChevronLeft" class="w-5 h-5"></lucide-angular>
  </button>

  <button
    class="absolute p-3 transform -translate-y-1/2 bg-white/90 rounded-full shadow-md right-4 top-1/2 hover:scale-110 transition-transform hover:bg-white"
    (click)="nextSlide()"
    aria-label="Next slide"
  >
    <lucide-angular [img]="ChevronRight" class="w-5 h-5"></lucide-angular>
  </button>

  <!-- Indicators -->
  <div
    class="absolute bottom-8 left-1/2 transform -translate-x-1/2 flex space-x-3"
  >
    @for (slide of heroSlides; track slide; let i = $index) {
    <button
      class="rounded-full transition-all duration-300"
      [ngClass]="{
        'bg-white w-8 h-3': i === currentSlide(),
        'bg-white/50 hover:bg-white/80 w-3 h-3': i !== currentSlide()
      }"
      (click)="goToSlide(i)"
      [attr.aria-label]="'Go to slide ' + (i + 1)"
    ></button>
    }
  </div>
</div>
