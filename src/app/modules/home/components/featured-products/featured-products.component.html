<section class="py-12">
  <div class="container mx-auto px-4">
    <div class="text-center mb-10">
      <h2 class="text-3xl font-bold tracking-tight">Productos Destacados</h2>
      <p class="mt-4 text-lg text-muted-foreground">
        Descubre nuestra selección de productos más populares y mejor valorados
      </p>
    </div>

    <div #productCarousel class="relative mb-16">
      <!-- Contenedor del carrusel con productos visibles -->
      <div class="overflow-hidden mx-auto max-w-7xl">
        <div #productContainer class="carousel-container">
          @for (product of featuredProducts; track product.id) { @if
          (isProductVisible(product)) {
          <div class="product-item">
            <product-card [product]="product"></product-card>
          </div>
          } }
        </div>
      </div>

      <!-- Botones de navegación - Ahora sin transformaciones -->
      <button
        (click)="handlePrevClick()"
        class="btn btn-circle btn-primary fixed-nav-btn left-0 md:-left-4"
        [disabled]="currentSlide() === 0 || isAnimating()"
        [class.opacity-50]="currentSlide() === 0 || isAnimating()"
        aria-label="Anterior"
      >
        <lucide-angular
          [img]="ChevronLeftIcon"
          class="w-6 h-6"
        ></lucide-angular>
      </button>

      <button
        (click)="handleNextClick()"
        class="btn btn-circle btn-primary fixed-nav-btn right-0 md:-right-4"
        [disabled]="currentSlide() === totalSlides - 1 || isAnimating()"
        [class.opacity-50]="currentSlide() === totalSlides - 1 || isAnimating()"
        aria-label="Siguiente"
      >
        <lucide-angular
          [img]="ChevronRightIcon"
          class="w-6 h-6"
        ></lucide-angular>
      </button>

      <!-- Indicadores de slide -->
      <div
        class="flex justify-center mt-8 space-x-2 absolute bottom-[-40px] left-0 right-0"
      >
        @for (indicator of slideIndicators; track indicator) {
        <button
          (click)="handleIndicatorClick(indicator)"
          class="w-3 h-3 rounded-full transition-colors duration-200"
          [class.bg-primary]="currentSlide() === indicator"
          [class.bg-gray-300]="currentSlide() !== indicator"
          [disabled]="isAnimating()"
          [attr.aria-label]="'Ir a slide ' + (indicator + 1)"
        ></button>
        }
      </div>
    </div>

    <!-- Ver todos los productos -->
    <div class="text-center mt-10">
      <a routerLink="/productos" class="btn btn-outline btn-wide">
        Ver todos los productos
      </a>
    </div>
  </div>
</section>

<style>
  .carousel-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
    will-change: transform, opacity; /* Optimiza las animaciones */
  }

  @media (min-width: 640px) {
    .carousel-container {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (min-width: 1024px) {
    .carousel-container {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  .fixed-nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: transform 0.2s ease, box-shadow 0.2s ease; /* Transición suave */
  }

  .fixed-nav-btn:hover:not(:disabled) {
    transform: translateY(-50%) scale(1.05);
    box-shadow: 0 6px 10px rgba(0, 0, 0, 0.15);
  }

  .product-item {
    transition: transform 0.2s ease;
    will-change: transform, opacity; /* Mejora el rendimiento */
  }
</style>
