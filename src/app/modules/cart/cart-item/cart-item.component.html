<div class="flex py-4 border-b last:border-0 item-container">
  <!-- Imagen del producto -->
  <div class="relative w-20 h-20 mr-4 overflow-hidden bg-base-200 rounded shadow-sm">
    <img
      [src]="item.imagen || '/assets/images/placeholder.png'"
      [alt]="item.nombre"
      class="object-contain w-full h-full"
    >
  </div>

  <!-- Información del producto -->
  <div class="flex flex-col flex-1">
    <div class="flex justify-between">
      <a [routerLink]="['/productos/producto', item.producto_id]" class="hover:text-primary transition-colors duration-200">
        <h3 class="font-medium">{{ item.nombre }}</h3>
      </a>
      <p class="font-semibold text-primary">
        ${{ formatPrice(item.precio * item.cantidad) }}
      </p>
    </div>

    <p class="mt-1 text-sm text-base-content/70">${{ formatPrice(item.precio) }} / unidad</p>

    <!-- Controles de cantidad y botón eliminar -->
    <div class="flex items-center justify-between mt-auto">
      <!-- Control de cantidad -->
      <div class="flex items-center border rounded">
        <button
          class="btn btn-xs btn-ghost quantity-btn"
          [disabled]="item.cantidad <= 1"
          (click)="updateQuantity(item.cantidad - 1)">
          <lucide-angular [img]="MinusIcon" class="w-3 h-3"></lucide-angular>
        </button>

        <span class="w-8 text-center">{{ item.cantidad }}</span>

        <button
          class="btn btn-xs btn-ghost quantity-btn"
          (click)="updateQuantity(item.cantidad + 1)">
          <lucide-angular [img]="PlusIcon" class="w-3 h-3"></lucide-angular>
        </button>
      </div>

      <!-- Botón eliminar -->
      <button
        class="btn btn-ghost btn-sm text-error remove-btn"
        (click)="remove()">
        <lucide-angular [img]="TrashIcon" class="w-4 h-4 mr-1"></lucide-angular>
        Eliminar
      </button>
    </div>
  </div>
</div>
