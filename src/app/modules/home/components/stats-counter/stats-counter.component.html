<div #statsSection id="stats-section" class="py-12 bg-gray-50 dark:bg-gray-900">
  <div class="container px-4 mx-auto">
    <div class="grid gap-8 text-center sm:grid-cols-2 lg:grid-cols-4">
      @for (stat of stats; track stat.id; let i = $index) {
        <div class="stat-card p-6 bg-base-100 rounded-lg shadow-sm">
          <lucide-angular
            [img]="stat.icon"
            [ngClass]="stat.color"
            class="w-12 h-12 mx-auto mb-4"
          ></lucide-angular>

          <h3 class="text-4xl font-bold">
            {{ counts()[i] !== undefined ? formatNumber(counts()[i], stat.decimal) : '0' }}
            @if (stat.id === 4) {
              <span class="text-2xl">/5</span>
            }
          </h3>

          <p class="mt-2 text-lg text-muted-foreground">{{ stat.label }}</p>
        </div>
      }
    </div>
  </div>
</div>
